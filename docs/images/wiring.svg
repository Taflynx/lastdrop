<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Wiring: sensor brown to red 5V, blue to black GND, yellow to yellow GPIO26, each joined with a WAGO 221-412; the white Grove wire is not used">
<style>
  .bg{fill:#ffffff} .card{fill:#f4f7f7;stroke:#d5dede} .t{fill:#1d2a2e;font:600 15px system-ui,-apple-system,Segoe UI,sans-serif}
  .s{fill:#5b6b70;font:13px system-ui,-apple-system,Segoe UI,sans-serif} .wago{fill:#e9eef0;stroke:#8a9a9e}
  .lever{fill:#f08a24}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d} .t{fill:#e6edf3} .s{fill:#9aa7b0} .wago{fill:#1f262d;stroke:#56646a}
  }
</style>
<rect class="bg" width="960" height="330" rx="16"/>

<rect class="card" x="20" y="30" width="200" height="270" rx="14"/>
<text class="t" x="120" y="60" text-anchor="middle">XKC-Y25-NPN</text>
<text class="s" x="120" y="80" text-anchor="middle">sensor wires</text>
<rect x="80" y="110" width="80" height="150" rx="10" fill="#3a4045"/>

<rect class="card" x="740" y="30" width="200" height="270" rx="14"/>
<text class="t" x="840" y="60" text-anchor="middle">ATOM Lite</text>
<text class="s" x="840" y="80" text-anchor="middle">Grove port (Grove2Dupont cable)</text>
<rect x="800" y="110" width="80" height="150" rx="12" fill="#2b2f33"/>

<!-- brown -> red 5V -->
<path d="M160,130 L410,130" stroke="#8b5a2b" stroke-width="6" fill="none"/>
<path d="M550,130 L800,130" stroke="#d93a3a" stroke-width="6" fill="none"/>
<!-- blue -> black GND -->
<path d="M160,185 L410,185" stroke="#2f6fd6" stroke-width="6" fill="none"/>
<path d="M550,185 L800,185" stroke="#222" stroke-width="6" fill="none"/>
<!-- yellow -> yellow GPIO26 -->
<path d="M160,240 L410,240" stroke="#e8c21a" stroke-width="6" fill="none"/>
<path d="M550,240 L800,240" stroke="#e8c21a" stroke-width="6" fill="none"/>
<!-- white unused -->
<path d="M800,280 L690,280" stroke="#cfd6d8" stroke-width="6" fill="none" stroke-dasharray="2 0"/>
<rect x="676" y="272" width="18" height="16" rx="3" fill="#7d8f93"/>
<text class="s" x="666" y="285" text-anchor="end">white: not used, insulate the end</text>

<g>
  <rect class="wago" x="410" y="112" width="140" height="36" rx="6"/><rect class="lever" x="428" y="104" width="38" height="10" rx="3"/><rect class="lever" x="494" y="104" width="38" height="10" rx="3"/>
  <rect class="wago" x="410" y="167" width="140" height="36" rx="6"/><rect class="lever" x="428" y="159" width="38" height="10" rx="3"/><rect class="lever" x="494" y="159" width="38" height="10" rx="3"/>
  <rect class="wago" x="410" y="222" width="140" height="36" rx="6"/><rect class="lever" x="428" y="214" width="38" height="10" rx="3"/><rect class="lever" x="494" y="214" width="38" height="10" rx="3"/>
</g>
<text class="s" x="480" y="135" text-anchor="middle">WAGO 221-412</text>

<text class="t" x="290" y="120" text-anchor="middle">brown</text><text class="t" x="675" y="120" text-anchor="middle">red · 5V</text>
<text class="t" x="290" y="175" text-anchor="middle">blue</text><text class="t" x="675" y="175" text-anchor="middle">black · GND</text>
<text class="t" x="290" y="230" text-anchor="middle">yellow</text><text class="t" x="675" y="230" text-anchor="middle">yellow · GPIO26</text>
<text class="s" x="480" y="318" text-anchor="middle">Wire colours can differ between sellers: check the product page before you connect.</text>
</svg>
