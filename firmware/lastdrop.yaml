# Lastdrop: low-water sensor for an espresso machine tank.
# M5Stack ATOM Lite + XKC-Y25-NPN capacitive sensor on the Grove port. ESPHome.
# Put your own values in secrets.yaml (see secrets.yaml.example). Never commit secrets.yaml.
esphome:
  name: lastdrop
  friendly_name: Lastdrop
  on_boot:
    priority: -100
    then:
      - script.execute: update_led

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret lastdrop_api_key

ota:
  - platform: esphome
    password: !secret lastdrop_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Lastdrop Fallback"

captive_portal:

# Built-in RGB LED on the ATOM Lite (SK6812 on GPIO27)
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 0.6s
          update_interval: 0.6s

binary_sensor:
  # XKC-Y25-NPN on the Grove port (yellow signal wire -> GPIO26)
  # If the state is reversed after testing, change inverted to false
  - platform: gpio
    id: water_ok
    name: "Water OK"
    device_class: moisture
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 2s
      - delayed_off: 10s
    on_state:
      - script.execute: update_led

  # Built-in button (GPIO39), exposed to Home Assistant
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO39
      inverted: true

script:
  - id: update_led
    then:
      - if:
          condition:
            binary_sensor.is_on: water_ok
          then:
            - light.turn_on:
                id: status_led
                red: 0%
                green: 100%
                blue: 0%
                brightness: 15%
                effect: "None"
          else:
            - light.turn_on:
                id: status_led
                red: 100%
                green: 0%
                blue: 0%
                brightness: 60%
                effect: "Pulse"
